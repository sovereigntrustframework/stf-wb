[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "stf-wb"
version = "0.1.0-alpha"
description = "Reference implementation of STF-Workbench v0.2.0 specification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sovereign Trust Framework", email = "dev@sovereigntrustframework.org"}
]
keywords = ["trust", "verification", "specification", "workbench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-core>=2.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "pygithub>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pytest-asyncio>=0.21",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.24",
]

[project.scripts]
stfwb = "stfwb_cli.main:cli"

[tool.poetry]
packages = [
    {include = "stfwb"},
    {include = "stfwb_cli"},
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=stfwb --cov=stfwb_cli --cov-report=html --cov-report=term-missing"